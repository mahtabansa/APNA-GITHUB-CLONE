  <style>
    @media (prefers-reduced-motion: no-preference) {
      .panel {
        animation: panel-in 650ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: var(--panel-delay);
      }
      .tile {
        transform-box: fill-box;
        transform-origin: center;
        animation: tile-in 550ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: var(--tile-delay);
      }
      .mona {
        animation: mona-in 450ms cubic-bezier(0.22, 1, 0.36, 1) 650ms both;
      }
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes tile-in {
      from { opacity: 0; transform: translateY(8px) scale(0.7); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes mona-in {
      from { opacity: 0; transform: translateY(48px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
